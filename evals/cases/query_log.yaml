# Synthesized stand-in for the real consultant query log (Discovery
# Findings §7/§10: 20-30 real query/ideal-answer pairs, in consultants'
# actual wording). Meridian Advisory and its stakeholders (including
# "Priya," who was to deliver this log) are fictional — this is a
# portfolio project, not an engagement with a real client, so that log
# will never literally arrive. These cases are Claude-synthesized to
# match the real-world usage patterns Discovery Findings describes
# (archetype distribution, situational/time-pressured wording), grounded
# against the actual pilot corpus rather than guessed — every
# relevant_sources path below was verified against real files under
# data/corpus/ by reading each cited document, the same discipline
# placeholder.yaml's cases followed. NOT a real client artifact; treat
# accordingly if this project is ever used as a template for a real
# engagement. See checkpoint.md's 2026-08-27 and 2026-09-04 entries for
# the full context.
#
# Archetype distribution approximates real-world frequency per Discovery
# Findings §7: lookup is the most common query type, synthesis is
# high-value but rarer, expertise-finding and comparative queries occur
# but the system can't (B) or won't (D) answer them — both still worth
# measuring for routing accuracy.
#
# 2026-09-04 (P2-2): expanded 25 -> 42 cases (ql026-ql042) toward a
# combined ~50-case eval set (with placeholder.yaml: A=20, B=10, C=15,
# D=5). New cases bring every one of the 52 corpus documents into at
# least one case's relevant_sources or query. Also ran a
# label-completeness audit (retrieval-only, zero LLM) over the original
# 17 A/C cases here: ql001, ql011, ql016 were under-labeled and are
# fixed below with an inline note; the rest were confirmed correct.
# placeholder.yaml is held out as an overfitting check-set — P2-3 tunes
# retrieval constants against THIS file only.

