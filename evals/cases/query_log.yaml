# Synthesized stand-in for the real consultant query log (Discovery
# Findings §7/§10: 20-30 real query/ideal-answer pairs, in consultants'
# actual wording). Meridian Advisory and its stakeholders (including
# "Priya," who was to deliver this log) are fictional — this is a
# portfolio project, not an engagement with a real client, so that log
# will never literally arrive. These 25 cases are Claude-synthesized to
# match the real-world usage patterns Discovery Findings describes
# (archetype distribution, situational/time-pressured wording), grounded
# against the actual pilot corpus rather than guessed — every
# relevant_sources path below was verified against real files under
# data/corpus/ by reading each cited document, the same discipline
# placeholder.yaml's cases followed. NOT a real client artifact; treat
# accordingly if this project is ever used as a template for a real
# engagement. See checkpoint.md's 2026-08-27 entry for the full context.
#
# Archetype distribution (A=10, C=7, B=5, D=3) approximates real-world
# frequency per Discovery Findings §7: lookup is the most common query
# type, synthesis is high-value but rarer, expertise-finding and
# comparative queries occur but the system can't (B) or won't (D) answer
# them — both still worth measuring for routing accuracy.

