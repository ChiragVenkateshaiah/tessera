- id: fb001
  query: "Where's our worked example for calculating price elasticity from transaction data?"
  archetype: A
  relevant_sources:
    - methodology/pricing-strategy-elasticity-calculation-reference.md
    - methodology/pricing-strategy-price-elasticity.md
  ideal_answer: >-
    Points to the Pricing Strategy: Elasticity Calculation Reference. Its
    Framework section shows how to estimate elasticity from transaction data
    with a log-log demand regression (controls for seasonality, own
    promotions, competitor price, store fixed effects and holidays, with
    store-clustered errors), says to report the confidence interval, gives
    the arc-elasticity formula for a single observed price change, and works
    a breakeven substitution (price 10.00, variable cost 8.00 -> margin
    ratio 0.20 -> breakeven |e| = 5.0). The Price Elasticity Analysis
    methodology page is the companion on when to use elasticity and how to
    interpret it. It should not say no worked example exists.
