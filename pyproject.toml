[project]
name = "tessera"
version = "0.1.0"
description = "Tessera — internal knowledge assistant pilot (Phase 1: local ingestion/retrieval core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "openai>=1.40",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tessera = "tessera.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
